# Builds the mini's firmware and publishes it as a release whenever
# FW_VERSION in firmware/mini/mn_version.h changes on main. Minis install the
# latest release's mini-X.Y.bin over Wi-Fi; mini-X.Y-full.bin is the same
# program with the start-up pieces, for a first install from the browser
# (flash/README.md). On a pull request it only builds, so a change that
# doesn't compile shows up before it's approved.
name: Build and release mini firmware

on:
  push:
    branches: [main]
    paths: ["firmware/mini/**", ".github/workflows/release.yml"]
  pull_request:
    paths: ["firmware/mini/**", "firmware/mini_hw_test/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: ver
        run: |
          V=$(grep -oP 'FW_VERSION "\K[^"]+' firmware/mini/mn_version.h)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # on a pull request: always build, never publish
          if [ "${{ github.event_name }}" != pull_request ] && gh release view "v$V" > /dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Already released
        if: steps.ver.outputs.exists == '1'
        run: echo "v${{ steps.ver.outputs.version }} is already released - bump FW_VERSION to publish a new one."

      - uses: arduino/setup-arduino-cli@v2
        if: steps.ver.outputs.exists != '1'

      - name: Install the ESP32 core and libraries
        if: steps.ver.outputs.exists != '1'
        run: |
          URL=https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@2.0.9 --additional-urls "$URL"
          arduino-cli lib install "ArduinoJson@7.4.2"
          arduino-cli config init --overwrite
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url https://github.com/lovyan03/LovyanGFX.git#1.2.7
          arduino-cli lib list
          pip install pyserial

      - name: Build
        if: steps.ver.outputs.exists != '1'
        run: |
          FQBN="esp32:esp32:esp32:PartitionScheme=min_spiffs"
          arduino-cli compile --fqbn "$FQBN" --build-property "compiler.cpp.extra_flags=-std=gnu++17" \
            --output-dir build firmware/mini
          arduino-cli compile --fqbn "$FQBN" --output-dir build_test firmware/mini_hw_test
          V=${{ steps.ver.outputs.version }}
          cp build/mini.ino.bin "mini-$V.bin"
          # an app image starts with 0xE9
          test "$(head -c1 "mini-$V.bin" | od -An -tx1 | tr -d ' ')" = "e9"
          tools/make_full_bin.sh build mini "mini-$V-full.bin"
          ls -la mini-*.bin

      - name: Publish the release
        if: steps.ver.outputs.exists != '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release create "v$V" "mini-$V.bin" "mini-$V-full.bin" --title "Mini $V" \
            --notes "Mini Scoreboard firmware $V. Minis pick it up overnight, or tap Check for updates now at mini.local."
